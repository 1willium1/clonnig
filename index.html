<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrendRadar AI</title>
  <meta name="description" content="Shopee feed and Meta affiliate radar for finding product opportunities, content angles, ads, offers, and reports." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Clean fallback styles & platform logo icon */
    .platform-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .product-thumbnail.table img,
    .product-thumbnail.compact img,
    .product-thumbnail.drawer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .product-row {
      cursor: pointer;
    }
    .inspect-product-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .status-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .status-pill.green {
      background: var(--green-soft);
      color: #004616;
      border-color: #9fd3a9;
    }
    .status-pill.blue {
      background: var(--blue-soft);
      color: var(--blue-strong);
      border-color: #a5c9e9;
    }
    .status-pill.amber {
      background: var(--amber-soft);
      color: #734800;
      border-color: #f0ca96;
    }
    .score-pill {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .score-pill.green {
      background: var(--green-soft);
      color: #004616;
    }
    .score-pill.blue {
      background: var(--blue-soft);
      color: var(--blue-strong);
    }
    .score-pill.amber {
      background: var(--amber-soft);
      color: #734800;
    }
    .score-pill.slate {
      background: var(--surface-soft);
      color: var(--slate);
    }
    .finder-table th input[type="checkbox"],
    .finder-table td input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue);
      cursor: pointer;
    }
    .finder-search input {
      width: 100%;
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      color: var(--ink);
    }
    .topbar-search-input {
      width: 100%;
    }
    .text-link {
      background: none;
      border: none;
      color: var(--blue);
      cursor: pointer;
      font-size: inherit;
      padding: 0;
      text-decoration: underline;
      font-weight: 700;
    }
    .view-link {
      background: none;
      border: none;
      color: var(--blue);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0;
    }
    .nav-scrim.visible {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 30;
      border: none;
    }
    @media (max-width: 900px) {
      .mobile-only {
        display: inline-flex !important;
      }
      .sidebar {
        position: fixed;
        left: -300px;
        top: 0;
        bottom: 0;
        z-index: 40;
        transition: left 0.25s ease;
      }
      .sidebar.open {
        left: 0;
      }
      .app-shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="product-drawer-container"></div>
  <div id="app-toast-container"></div>

  <!-- Load products dataset -->
  <script src="products_data.js"></script>
  <!-- Main application script -->
  <script src="app.js"></script>
</body>
</html>
